version: "3.9"

services:
  # ==========================================================================
  # Infrastructure
  # ==========================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urbanpulse-postgres
    environment:
      POSTGRES_DB: urbanpulse
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urbanpulse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: urbanpulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: urbanpulse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  minio:
    image: minio/minio:latest
    container_name: urbanpulse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: urbanpulse-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # ==========================================================================
  # Application Services
  # ==========================================================================
  data-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.data-gateway
    container_name: urbanpulse-data-gateway
    ports:
      - "8100:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  inference:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.inference
    container_name: urbanpulse-inference
    ports:
      - "8200:8000"
    env_file: .env
    depends_on:
      - redis
      - postgres

  orchestration:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.orchestration
    container_name: urbanpulse-orchestration
    ports:
      - "8300:8000"
    env_file: .env
    depends_on:
      - inference
      - chromadb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbanpulse-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8100
      - NEXT_PUBLIC_WS_URL=ws://localhost:8100/ws
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_ACCESS_TOKEN}

volumes:
  postgres_data:
  minio_data:
  chroma_data:
